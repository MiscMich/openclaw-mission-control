packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  '@babel/core': '>=7.29.1'
  'brace-expansion@<1.1.18': '1.1.18'
  dompurify: '>=3.4.13'
  flatted: '>=3.4.2'
  follow-redirects: '>=1.15.12'
  'minimatch@>=3.0.0 <3.1.4': '3.1.4'
  'minimatch@>=9.0.0 <9.0.7': '9.0.7'
  'picomatch@>=2.0.0 <2.3.2': '2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '4.0.4'
  'rollup@>=4.0.0 <4.59.0': '4.63.0'
  'vite@>=7.0.0 <7.3.5': '7.3.6'

minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3
  - '@next/eslint-plugin-next@16.3.3'
  - eslint-config-next@16.3.3
